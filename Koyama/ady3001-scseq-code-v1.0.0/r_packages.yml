# ---------------------------------------------------------------------------
# r_packages.yml - the exact R package versions that produced the published
# figures of Koyama et al., Science Immunology (ady3001).
#
# Generated 2026-09-21 from the sessionInfo of the verified deposit runs and the
# DESCRIPTION file of every installed package. Nothing here is typed by hand.
#
# THIS IS A RECORD, NOT AN INSTALLER. It states what ran. Use
# environment.yml or 03_environment/install_r_pin.sh to build an environment.
#
# The two experiments used DIFFERENT Seurat versions and this is not an error:
#   Exp160 / Exp649 (Fig 4, 7, S6, S7, S10, S11) : R 4.4.0, Seurat 5.1.0
#   Exp80           (Fig S3)                     : R 4.3.2, Seurat 5.0.0
# The versions below are the Exp160/Exp649 environment, in which Fig S3 also
# reproduces (a deliberate version-drift test; see README.md).
# ---------------------------------------------------------------------------

