caveats:
  - "TWO ENVIRONMENTS, deliberately. 'original_2024' is the ONLY original sessionInfo that exists for any published analysis in this paper - recovered from the rendered 241221_Marilyn.html. 'deposit_rerun' is the 2026 re-run. They differ (R 4.3.2/Seurat 5.0.0 on macOS vs R 4.4.0/Seurat 5.1.0 on Linux), which makes the Fig S3 reproduction a deliberate version-DRIFT test, not a version-matched run."
  - "The script verifies itself TWO independent ways: route A from the four deposited per-tag matrices, route B from the deposited Combined matrix split by Sample_Tag_Calls.csv. The two give byte-identical matrices."
  - "Only FOUR of the eight sample tags are deposited (SampleTag05-08 = LP, EL). That is sufficient for Fig S3; the raw FASTQ carries all eight."
  - "Fig S3A reproduces with the UMAP HORIZONTALLY MIRRORED. UMAP is defined only up to rotation and reflection - this is expected, not a defect."
  - "Sample_Tag_Calls.csv spells the tag 'SampleTag05_mm', not 'SampleTag05'."
  - "BD pipeline v1.8 CANNOT be version-matched from FASTQ: BD never published the v1.8 targeted CWL and it is not inside the v1.8 container. The deposited matrices are BD's original output."
  - "Exp80 is a TARGETED panel (MM Immune Response amplicons), not WTA - which is why a _DBEC_ file exists and is meaningful here. The published analysis nonetheless read RSEC: 241221_Marilyn.Rmd reads *_mm_RSEC_MolsPerCell.csv. What the analysis read wins over BD's recommendation."
