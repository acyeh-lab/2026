# Exp160 - every software version and input this analysis depends on.
# Package versions are taken from the sessionInfo recorded by the runs that
# produced the published figures.

experiment: Exp160
manuscript: Koyama et al., Science Immunology (ady3001)
figures: [Fig 4B-D, Fig S6A-E, Fig S7B-E]
geo_series: GSE348009
geo_samples:
  cartridge1: GSM10065191   # naive WT B6
  cartridge2: GSM10065192   # 24 h post-TBI WT B6
  cartridge3: GSM10065193   # 24 h post-TBI MHC-II KO

bd_rhapsody:
  pipeline_version: "1.9.1"
  per_sample:
    cartridge1: {version: "1.9.1", analysis_date: "2020-12-09 04:41:02"}
    cartridge2: {version: "1.9.1", analysis_date: "2020-12-09 22:51:24"}
    cartridge3: {version: "1.9.1", analysis_date: "2020-12-10 07:13:28"}
  umi_correction: RSEC
  abseq_targets: 4
  sequencer: "Illumina NovaSeq 6000"
  run: "201019_A00613_0188_BHTK53DRXX"
  deposit_directory_names: "cartridge1/, cartridge2/, cartridge3/"

