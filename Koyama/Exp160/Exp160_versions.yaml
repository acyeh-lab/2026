reads:
  01_fig4_figS6.Rmd:
    - "cartridge1_RSEC_MolsPerCell.csv"
    - "cartridge2_RSEC_MolsPerCell.csv"
  02_figS7.Rmd:
    - "cartridge2_RSEC_MolsPerCell.csv"
    - "cartridge3_RSEC_MolsPerCell.csv"

