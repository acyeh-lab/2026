expected_results:
  - script: "Exp160/01_fig4_figS6.Rmd"
    figures: "Fig 4B-D, Fig S6A-E"
    cells_loaded: 15288
    cells_final: 8032
    clusters: "7"
    panels: 40
    note: "QC filter only (percent.mt < 40)"
  - script: "Exp160/02_figS7.Rmd"
    figures: "Fig S7B-E"
    cells_loaded: 23841
    cells_final: 7478
    clusters: "6"
    panels: 26
    note: "QC filter only (percent.mt < 40)"

caveats:
  - "The two scripts are INDEPENDENT - each loads the CSVs itself. cartridge2 appears in both and is re-clustered separately in each."
  - "The mitochondrial filter is percent.mt < 40 for both analyses. At 25 the Figure 4 / S6 arm keeps 6,412 cells instead of the published 8,032."
  - "A GEO download is flat. The scripts expect per-cartridge directories named cartridge1/ cartridge2/ cartridge3/ under $ADY3001_DATA; tools/unpack_geo_download.sh builds that tree."
